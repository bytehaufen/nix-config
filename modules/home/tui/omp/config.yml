modelRoles:
  default: openai-codex/gpt-6.2-sol:xhigh
  plan: "@slow"
  task: "@default"
  smol: openai-codex/gpt-6-luna:high
  slow: openai-codex/gpt-6.2-astra:high
  commit: "@smol"
  tiny: "@smol"
  vision: "@default"
  memory: "@smol"
  advisor: "@default"
symbolPreset: nerd
composer:
  shape: band
  tokenRate: true
