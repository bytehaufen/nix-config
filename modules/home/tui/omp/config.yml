personality: pragmatic
tools:
  approvalMode: yolo
stt:
  enabled: true
startup:
  quiet: true
update:
  channel: stable
memory:
  backend: local
sharpshooter:
  model: ""
edit:
  mode: hashline
read:
  renderMarkdown: true
  toolResultPreview: true
